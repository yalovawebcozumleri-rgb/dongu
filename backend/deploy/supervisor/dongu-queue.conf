[program:dongu-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/dongu/current/artisan queue:work database --sleep=2 --tries=3 --backoff=5 --timeout=60 --max-time=3600
directory=/var/www/dongu/current
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/dongu/shared/storage/logs/queue-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=90
